name: BackcountryAI
options:
  bundleIdPrefix: com.collinbrowse
  deploymentTarget:
    iOS: "26.0"
packages:
  # Prototype: an optional bigger on-device model (Qwen 3.5 4B) for answers. See docs/on-device-model-comparison.md.
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.32.3
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    from: 0.32.3
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
targets:
  BackcountryAI:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - target: BackcountryAIDownloader
      - package: MLXSwiftLM
        products: [MLXLLM, MLXLMCommon]   # not MLXHuggingFace: its macros need approval; BetterModel has the adapters
      - package: MLXSwift
        products: [MLX]
      - package: SwiftHuggingFace
        products: [HuggingFace]
      - package: SwiftTransformers
        products: [Tokenizers]
    scheme:
      testTargets: [BackcountryAITests]
    postBuildScripts:
      # Debug builds only: the demo library and scripted answers for App Store screenshots (ScreenshotMode.swift).
      - name: Screenshot fixtures (Debug only)
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: |
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/ScreenshotFixtures"
          if [ "$CONFIGURATION" = "Debug" ]; then
            rsync -a --delete "$SRCROOT/fastlane/screenshot-fixtures/" "$DEST/"
          else
            rm -rf "$DEST"
          fi
    info:
      path: Sources/Info.plist
      properties:
        # Apple-Hosted Background Assets: the library packs live on Apple's servers (App Store Connect).
        BAAppGroupID: group.com.collinbrowse.backcountryai
        BAHasManagedAssetPacks: true
        BAUsesAppleHosting: true
    entitlements:
      path: Sources/BackcountryAI.entitlements
      properties:
        com.apple.security.application-groups: [group.com.collinbrowse.backcountryai]
        # A 4B model needs ~4 GB while answering; without this, iOS stops the app sooner on 8 GB iPhones.
        com.apple.developer.kernel.increased-memory-limit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.collinbrowse.backcountryai
        DEVELOPMENT_TEAM: 84XX2W7G34
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BackcountryAI
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        # Only HTTPS and Apple's frameworks: exempt, so App Store Connect skips the export-compliance question.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO   # the fixtures script reads fastlane/screenshot-fixtures
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  BackcountryAITests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: BackcountryAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.collinbrowse.backcountryai.tests
        DEVELOPMENT_TEAM: 84XX2W7G34
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
  # App Store screenshots and preview videos (fastlane screenshots / previews). Never part of a release build.
  BackcountryAIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: BackcountryAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.collinbrowse.backcountryai.uitests
        DEVELOPMENT_TEAM: 84XX2W7G34
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
  BackcountryAIDownloader:
    type: extensionkit-extension
    platform: iOS
    sources: [DownloaderExtension]
    info:
      path: DownloaderExtension/Info.plist
      properties:
        CFBundleDisplayName: BackcountryAI Downloader
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.background-asset-downloader-extension
    entitlements:
      path: DownloaderExtension/BackcountryAIDownloader.entitlements
      properties:
        com.apple.security.application-groups: [group.com.collinbrowse.backcountryai]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.collinbrowse.backcountryai.downloader
        DEVELOPMENT_TEAM: 84XX2W7G34
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  BackcountryAIScreenshots:
    build:
      targets:
        BackcountryAI: all
        BackcountryAIUITests: [test]
    test:
      config: Debug
      targets: [BackcountryAIUITests]
