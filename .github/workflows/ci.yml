# Every pull request: build and run the unit tests. Pushes to main aren't run here: the TestFlight workflow runs
# the same tests before it uploads, so a second run would only repeat them.
name: CI
on:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # Needs Xcode 27 (the app is built with the iOS 27 SDK). Set the MACOS_RUNNER repository variable to "self-hosted" to
    # run on your own Mac instead (docs/release.md). Pull requests from forks always get GitHub's machine, so a
    # stranger's code never runs on that Mac.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bundle exec fastlane test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: build/test.log
